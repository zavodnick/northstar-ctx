[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-ctx"
version = "3.4.0"
description = "Deterministic Word (.docx) tracked-change builder and verifier driven by a JSON edit plan."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["defusedxml>=0.7", "python-docx>=1.1"]

[project.scripts]
ctx-redline = "northstar_ctx.redline_builder:main"
ctx-verify = "northstar_ctx.verify_redline:cli"

[tool.setuptools]
packages = ["northstar_ctx"]
